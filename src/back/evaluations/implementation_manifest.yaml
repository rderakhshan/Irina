    reason: No approval workflow or identity model
  - id: production_rag
    reason: Fixture-only retrieval; no ingestion/index pipeline
  - id: retention_tenancy
    reason: No centralized retention/erasure or tenancy
  - id: online_eval
    reason: Self-hosted Opik online evaluation/guardrails/RBAC unverified
  - id: deep_eval
    reason: Package not installed/verified
  - id: benchmarks
    reason: No pinned local benchmark cache or license verification

